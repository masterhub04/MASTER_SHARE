<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Share</title>
    <!-- Tailwind CSS CDN para testes rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkSidebar: '#121214',
                        darkMain: '#0b0b0d',
                        darkPanel: '#18181b',
                        accentBlue: '#2b55ff',
                        accentHover: '#1f3ec9'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hide-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body class="bg-darkMain text-gray-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Barra de Título Superior (Janela Desktop) -->
    <div class="h-9 bg-[#0e0e10] flex items-center justify-between px-4 border-b border-gray-800/60 text-xs">
        <div class="flex items-center space-x-2">
            <div class="w-5 h-5 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded flex items-center justify-center text-white font-bold text-[10px] shadow-sm shadow-blue-500/50">M</div>
            <span class="font-semibold text-gray-200 tracking-wide">MASTER SHARE</span>
        </div>
        <!-- Botões de Controle da Janela do Windows -->
        <div class="flex items-center space-x-4 text-gray-400">
            <button data-window="minimize" class="hover:text-white transition" title="Minimizar"><i class="fa-solid fa-minus text-[10px]"></i></button>
            <button data-window="maximize" class="hover:text-white transition" title="Maximizar"><i class="fa-regular fa-square text-[10px]"></i></button>
            <button data-window="close" class="hover:text-red-400 transition" title="Fechar"><i class="fa-solid fa-xmark text-sm"></i></button>
        </div>
    </div>

    <!-- Container Principal da Aplicação -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Painel Lateral Esquerdo (Sidebar) -->
        <aside class="w-64 bg-darkSidebar flex flex-col border-r border-gray-800/40">
            
            <!-- Seletor de Servidor -->
            <div class="p-3 border-b border-gray-800/40 flex items-center justify-between cursor-pointer hover:bg-white/[0.02] transition">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-500/20">
                        <i class="fa-solid fa-bolt text-white text-sm"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-gray-100 leading-tight">Game Confidencial</h2>
                        <div class="flex items-center space-x-1.5 mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="text-[11px] text-gray-400">3 membros online</span>
                        </div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </div>

            <!-- Canais de Transmissão -->
            <div class="flex-1 overflow-y-auto hide-scrollbar px-3 py-4 space-y-6">
                <div>
                    <div class="px-2 mb-2 text-[11px] font-bold uppercase tracking-wider text-gray-400 flex items-center justify-between">
                        <span>Canais de Transmissão</span>
                    </div>
                    <div class="space-y-1">
                        <button type="button" data-channel="Geral" class="channel-option w-full flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-white/[0.04] hover:text-gray-200 transition text-sm text-left">
                            <span class="flex items-center space-x-2.5"><i class="fa-solid fa-volume-high text-sm"></i><span>Geral</span></span>
                            <span class="text-xs text-gray-500">0 / 5</span>
                        </button>
                        <button type="button" data-channel="Jogos" class="channel-option w-full flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-white/[0.04] hover:text-gray-200 transition text-sm text-left">
                            <span class="flex items-center space-x-2.5"><i class="fa-solid fa-volume-high text-sm"></i><span>Jogos</span></span>
                            <span class="text-xs text-gray-500">0 / 5</span>
                        </button>
                        <button type="button" data-channel="Privado" class="channel-option w-full flex items-center justify-between px-3 py-2 rounded-lg text-gray-400 hover:bg-white/[0.04] hover:text-gray-200 transition text-sm text-left">
                            <span class="flex items-center space-x-2.5"><i class="fa-solid fa-lock text-xs"></i><span>Privado</span></span>
                            <span class="text-xs text-gray-500">0 / 5</span>
                        </button>
                    </div>

                </div>

                <!-- Lista de Usuários -->
                <div>
                    <div class="px-2 mb-2 text-[11px] font-bold uppercase tracking-wider text-gray-400">Usuários</div>
                    <div id="user-list" class="px-2 py-3 text-xs text-gray-500">
                        Nenhum usuário conectado.
                    </div>
                </div>
            </div>

            <!-- Rodapé da Sidebar -->
            <div class="p-3 bg-[#0d0d0f] border-t border-gray-800/40 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <span id="connection-indicator" class="w-2 h-2 rounded-full bg-gray-500"></span>
                    <div>
                        <p id="connection-status" class="text-xs font-bold text-gray-400">Desconectado</p>
                        <p id="connection-channel" class="text-[10px] text-gray-500 truncate w-32">Nenhum canal</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 text-gray-400">
                    <button class="w-7 h-7 rounded-lg hover:bg-white/5 hover:text-white transition flex items-center justify-center" title="Áudio (em breve)"><i class="fa-solid fa-headphones text-xs"></i></button>
                    <button class="w-7 h-7 rounded-lg hover:bg-white/5 hover:text-white transition flex items-center justify-center" title="Configurações (em breve)"><i class="fa-solid fa-gear text-xs"></i></button>
                </div>
            </div>

        </aside>

        <!-- Área Principal de Conteúdo -->
        <main class="flex-1 flex flex-col bg-darkMain relative">
            
            <!-- Barra Superior do Canal -->
            <div class="h-12 border-b border-gray-800/40 px-6 flex items-center justify-between bg-darkMain/50 backdrop-blur">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-volume-high text-gray-400"></i>
                    <span id="active-channel-title" class="font-bold text-sm text-gray-200">Nenhum canal selecionado</span>
                    <span class="text-gray-600">|</span>
                    <span id="channel-members" class="text-xs text-gray-500">0 usuários</span>
                </div>
                <button id="join-channel" type="button" class="px-4 py-2 rounded-lg bg-accentBlue hover:bg-accentHover text-white text-xs font-semibold transition">Conectar ao canal            <!-- Palco de Transmissão -->
            <div class="flex-1 p-5 flex items-center justify-center relative overflow-hidden">
                <div id="stream-stage" class="w-full h-full rounded-2xl bg-[#080809] border border-gray-800/60 relative overflow-hidden shadow-2xl flex flex-col items-center justify-center text-center px-6">
                    <div class="w-16 h-16 rounded-2xl bg-gray-900 border border-gray-800 flex items-center justify-center mb-4">
                        <i class="fa-solid fa-display text-2xl text-gray-600"></i>
                    </div>
                    <h3 id="stage-title" class="text-base font-semibold text-gray-300">Nenhum canal conectado</h3>
                    <p id="stage-description" class="mt-2 text-sm text-gray-500 max-w-md">Selecione um canal na lateral e clique em “Conectar ao canal”. A área de transmissão ficará pronta para receber sua tela.</p>
                </div>
            </div>

            <!-- Controles: serão ativados nas próximas etapas -->
            <div id="channel-controls" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 flex items-center space-x-3 bg-darkSidebar/90 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/10 shadow-2xl opacity-40 pointer-events-none">
                <button class="w-11 h-11 rounded-xl bg-gray-800/80 text-gray-500 flex items-center justify-center" title="Microfone (em breve)"><i class="fa-solid fa-microphone text-sm"></i></button>
                <button class="w-11 h-11 rounded-xl bg-gray-800/80 text-gray-500 flex items-center justify-center" title="Câmera (em breve)"><i class="fa-solid fa-video text-sm"></i></button>
                <button id="leave-channel" class="w-12 h-11 rounded-xl bg-red-600 hover:bg-red-500 text-white flex items-center justify-center transition" title="Sair do canal" disabled><i class="fa-solid fa-phone-slash text-sm"></i></button>
                <button class="w-11 h-11 rounded-xl bg-gray-800/80 text-gray-500 flex items-center justify-center" title="Compartilhar tela (próxima etapa)"><i class="fa-solid fa-desktop text-sm"></i></button>
                <button class="w-11 h-11 rounded-xl bg-gray-800/80 text-gray-500 flex items-center justify-center" title="Mais opções (em breve)"><i class="fa-solid fa-ellipsis text-sm"></i></button>
            </div>

        </main>
    </div>


    <script>
      (() => {
        const send = (action, data = {}) => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ action, ...data });
          }
        };

        document.querySelectorAll('[data-window]').forEach(button => {
          button.addEventListener('click', () => send('window', { command: button.dataset.window }));
        });

        const channelButtons = [...document.querySelectorAll('[data-channel]')];
        const joinButton = document.getElementById('join-channel');
        const leaveButton = document.getElementById('leave-channel');
        const title = document.getElementById('active-channel-title');
        const members = document.getElementById('channel-members');
        const status = document.getElementById('connection-status');
        const statusChannel = document.getElementById('connection-channel');
        const indicator = document.getElementById('connection-indicator');
        const userList = document.getElementById('user-list');
        const stageTitle = document.getElementById('stage-title');
        const stageDescription = document.getElementById('stage-description');
        const controls = document.getElementById('channel-controls');

        let selectedChannel = null;
        let connectedChannel = null;

        function render() {
          channelButtons.forEach(button => {
            const active = button.dataset.channel === selectedChannel;
            button.className = 'channel-option w-full flex items-center justify-between px-3 py-2 rounded-lg transition text-sm text-left ' +
              (active ? 'bg-accentBlue text-white shadow-lg shadow-blue-600/20' : 'text-gray-400 hover:bg-white/[0.04] hover:text-gray-200');
            button.querySelector('span:last-child').textContent =
              button.dataset.channel === connectedChannel ? '1 / 5' : '0 / 5';
          });

          const connected = Boolean(connectedChannel);
          title.textContent = selectedChannel || 'Nenhum canal selecionado';
          members.textContent = connected ? '1 usuário neste dispositivo' : '0 usuários';
          joinButton.textContent = connected
            ? (connectedChannel === selectedChannel ? 'Conectado' : 'Trocar de canal')
            : 'Conectar ao canal';
          joinButton.disabled = !selectedChannel || connectedChannel === selectedChannel;
          joinButton.classList.toggle('opacity-50', joinButton.disabled);
          leaveButton.disabled = !connected;
          leaveButton.classList.toggle('opacity-40', !connected);
          controls.classList.toggle('opacity-40', !connected);
          controls.classList.toggle('pointer-events-none', !connected);

          status.textContent = connected ? 'Conectado localmente' : 'Desconectado';
          status.className = 'text-xs font-bold ' + (connected ? 'text-emerald-400' : 'text-gray-400');
          indicator.className = 'w-2 h-2 rounded-full ' + (connected ? 'bg-emerald-500' : 'bg-gray-500');
          statusChannel.textContent = connected ? connectedChannel + ' • Game Confidencial' : 'Nenhum canal';

          userList.innerHTML = connected
            ? '<div class="flex items-center space-x-2.5 py-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="text-sm text-gray-200 font-medium">JamesMaster</span><span class="text-[10px] text-gray-500">Você</span></div>'
            : 'Nenhum usuário conectado.';

          stageTitle.textContent = connected ? 'Você está no canal ' + connectedChannel : 'Nenhum canal conectado';
          stageDescription.textContent = connected
            ? 'Canal conectado neste dispositivo. A próxima etapa será transmitir sua tela para esta área.'
            : 'Selecione um canal na lateral e clique em “Conectar ao canal”. A área de transmissão ficará pronta para receber sua tela.';
        }

        channelButtons.forEach(button => {
          button.addEventListener('click', () => {
            selectedChannel = button.dataset.channel;
            render();
          });
        });

        joinButton.addEventListener('click', () => {
          if (!selectedChannel) return;
          connectedChannel = selectedChannel;
          render();
          // Estado local de interface. A conexão entre computadores será adicionada com o servidor.
        });

        leaveButton.addEventListener('click', () => {
          connectedChannel = null;
          render();
        });

        window.masterShare = { send };
        window.addEventListener('message', event => {
          if (event.data && event.data.type === 'master-share-host') {
            document.documentElement.dataset.hostReady = 'true';
          }
        });

        render();
      })();
    </script>

</body>
</html>
